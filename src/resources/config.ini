# ============================================
# Cemantix Solver - Default Configuration File
# ============================================

[GENERAL]

# --------------------------------------------
# Word2Vec Search Settings
# --------------------------------------------

# Initial seed words to start the guessing process
# These should be general, common words to cover broad semantic space
start_words = amour, travail, animal

# Delay (in seconds) between each API request (to avoid rate-limiting or bans)
api_delay = 0.5

# Small epsilon used when compare similarity between starting words score and model scores
similarity_deta = 0.01

# --------------------------------------------
# Model & Data Paths
# --------------------------------------------

# Path to the Word2Vec binary model (must be in word2vec format)
model_path = src/resources/frWac.bin

# Path to the pickle file storing previously invalid (rejected) words
invalid_dict_path = src/resources/invalid_words.pkl

# --------------------------------------------
# Cemantix API Configuration
# --------------------------------------------

# Protocol schema: use "http" or "https"
schema = https

# Domain name of the Cemantix website (used to build the API URL)
url = cemantix.certitudes.org

# HTTP headers to mimic a browser (some User-Agents may work better than others)
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/80.0.3987.149 Safari/537.36

# HTTP content type for POST requests
content_type = application/x-www-form-urlencoded

# Maximum number of retries for API requests if one fails
max_retries = 3

# --------------------------------------------
# Logging Configuration
# --------------------------------------------

# Logging level: DEBUG, INFO, WARNING, ERROR, or CRITICAL
log_level = INFO

# Path to the log file; leave empty to disable file logging
log_file = logs/solver.log
